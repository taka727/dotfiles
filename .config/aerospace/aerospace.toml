config-version = 2

# AeroSpace 起動時に SketchyBar も起動する
after-startup-command = ['exec-and-forget brew services start sketchybar']

# ワークスペース切り替え時に SketchyBar 側へ通知する（.config/sketchybar/items/spaces.lua が購読）
exec-on-workspace-change = ['/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

[mode.main.binding]
# Move focused window to another monitor
alt-shift-right = 'move-node-to-monitor --wrap-around next'
alt-shift-left  = 'move-node-to-monitor --wrap-around prev'

# Focus another monitor
alt-right = 'focus-monitor --wrap-around next'
alt-left  = 'focus-monitor --wrap-around prev'

# フォーカス中ウィンドウをその画面いっぱいに（トグル）
alt-f = 'fullscreen'

# リサイズモードへ（h/j/k/l で幅/高さ調整。esc か enter で main に戻る）
alt-r = 'mode resize'

# フォーカス中ウィンドウを新規ワークスペース（仮想ディスプレイ相当）に移動
alt-shift-n = 'exec-and-forget ~/.config/bin/aerospace-move-to-new-workspace'

# 直前にフォーカスしていたワークスペースに戻る
alt-shift-b = 'workspace-back-and-forth'

[mode.resize.binding]
h = 'resize width -50'
l = 'resize width +50'
j = 'resize height -50'
k = 'resize height +50'
esc = 'mode main'
enter = 'mode main'
